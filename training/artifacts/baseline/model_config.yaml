created_at: '2026-10-17 15:03:25'
data:
  input_feature: review_text
  target_feature: label (genuine=0, fake=1)
  test_path: RESERVED_NOT_LOADED
  train_path: data/splits/train.csv
  val_path: data/splits/validation.csv
lightgbm:
  boosting_type: gbdt
  class_weight: balanced
  colsample_bytree: 0.8
  learning_rate: 0.05
  n_estimators: 300
  num_leaves: 31
  objective: binary
  random_state: 42
  subsample: 0.8
model_type: tfidf_lightgbm
seed: 42
tfidf:
  max_df: 0.95
  max_features: 10000
  min_df: 3
  ngram_range:
  - 1
  - 2
  sublinear_tf: true
